services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: observability-studio-backend
    ports:
      - "8001:8001"
    environment:
      SLO_AI_ENABLED: ${SLO_AI_ENABLED:-true}
      SLO_AI_PROVIDER: ${SLO_AI_PROVIDER:-anthropic}
      SLO_AI_MODEL: ${SLO_AI_MODEL:-claude-3-5-sonnet-latest}
      SLO_AI_API_KEY: ${SLO_AI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: observability-studio-ui
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
